<th:block th:fragment="scripts">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <script th:inline="javascript">
        const userRoles = /*[[${#authentication?.principal?.authorities}]]*/ []

        function showAdminContent() {
            const adminContent = document.getElementById("admin-content");
            const userContent = document.getElementById("user-content");
            if (adminContent) {
                adminContent.style.display = "block";
            }
            if (userContent) {
                userContent.style.display = "none";
            }
            document.querySelector('.nav-link.active')?.classList.remove('active');
            document.querySelector('a[onclick="showAdminContent()"]').classList.add('active');
        }

        function showUserContent() {
            const adminContent = document.getElementById("admin-content");
            const userContent = document.getElementById("user-content");
            if (userContent) {
                userContent.style.display = "block";
            }
            if (adminContent) {
                adminContent.style.display = "none";
            }
            document.querySelector('.nav-link.active')?.classList.remove('active');
            document.querySelector('a[onclick="showUserContent()"]').classList.add('active');
        }

        if (userRoles.some(role => role.roleName === "ROLE_ADMIN")) {
            console.log("Admin role detected")
            showAdminContent();
        } else {
            console.log("User role detected")
            showUserContent();
        }
    </script>

    <script>
        document.querySelectorAll(".user-roles").forEach(function (roleCell) {
            let rolesText = roleCell.textContent;
            let formattedRoles = rolesText.split(" ").map(role => role.replace("ROLE_", ""));
            roleCell.textContent = formattedRoles.join(" ");
        });
    </script>

</th:block>
