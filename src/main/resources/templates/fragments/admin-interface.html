<div th:fragment="admin-content">
    <div class="container mt-4">
        <h1>Admin panel</h1>
        <div th:if="${errorMessage}" th:text="${errorMessage}" class="alert alert-danger"></div>
        <ul class="nav nav-tabs" id="adminTabs" role="tablist">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeTab == null or activeTab == 'admin-view' ? 'active' : ''}"
                   id="admin-view-tab" data-bs-toggle="tab" href="#admin-view"
                   role="tab" aria-selected="${activeTab == null or activeTab == 'admin-view' ? 'true' : 'false'}">Users table</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeTab == 'new-user' ? 'active' : ''}"
                   id="new-user-tab" data-bs-toggle="tab" href="#new-user"
                   role="tab" aria-selected="${activeTab == 'new-user' ? 'true' : 'false'}">New User</a>
            </li>
        </ul>
        <div class="card">
            <div class="tab-content" id="adminTabsContent">
                <div class="tab-pane fade"
                     th:classappend="${activeTab == null or activeTab == 'admin-view' ? 'show active' : ''}"
                     id="admin-view" role="tabpanel" aria-labelledby="admin-view-tab">
                    <h5 class="card-header">All users</h5>
                    <div class="card-body">
                        <div th:replace="fragments/admin-table :: users_table"></div>
                        <div class="modal fade" id="userEditModal" tabindex="-1" aria-labelledby="userEditModalLabel"
                             aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <form class="edit-user-form" th:object="${userRequestDto}">
                                        <input type="hidden" th:field="*{id}" id="id"/>
                                        <div class="modal-header">
                                            <h5 class="modal-title" id="userEditModalLabel">Edit user</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                    aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body" id="edit-user-form-control">
                                            <div>
                                                <label for="user-id">ID</label>
                                                <input type="text" th:field="*{id}" id="user-id" class="form-control"
                                                       readonly disabled/><br>
                                            </div>
                                            <div th:replace="fragments/edit-user-form :: edit-user-form"></div>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                                Close
                                            </button>
                                            <button type="button" class="btn btn-primary edit-user-button">Edit</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane fade" th:classappend="${activeTab == 'new-user' ? 'show active' : ''}"
                     id="new-user" role="tabpanel" aria-labelledby="new-user-tab">
                    <h5 class="card-header">Add new user</h5>
                    <div class="card-body">
                        <div class="form-container">
                            <form class="add-user-form">
                                <div th:replace="fragments/add-user-form :: add-user-form"></div>
                                <button type="button" class="btn btn-success btn-center add-user-button">Add new user</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
