<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="fragments/navbar-logout :: navbar"></div>
    <div class="d-flex justify-content-between">
        <div th:replace="fragments/sidebar :: sidebar"></div>
            <div class="col-md-1 ms-sm-auto col-lg-10 px-md-1 mt-0">
                <div sec:authorize="hasRole('ADMIN')" id="admin-content" style="display: none;">
                    <div th:replace="fragments/admin-interface :: admin-content"></div>
                </div>
                <div id="user-content" style="display: none;">
                    <div th:replace="fragments/user-interface :: user-content"></div>
            </div>
        </div>
    </div>

    <th:block th:replace="fragments/scripts :: scripts"></th:block>
    <script src="/dist/bundle.js" defer></script>
</body>
</html>
