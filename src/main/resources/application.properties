# App properties
server.port=8088

# Logging
logging.level.org.springframework.web=DEBUG

# MySQL properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_MS_SCHEMA_NAME}
spring.datasource.username=${DB_MS_USERNAME}
spring.datasource.password=${DB_MS_PASSWORD}

# Jpa & Hibernate properties
spring.jpa.show_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Admin properties initialize
admin.first_name=${MAIN_ADM_FIRSTNAME}
admin.last_name=${MAIN_ADM_LASTNAME}
admin.email=${MAIN_ADM_EMAIL}
admin.password=${MAIN_ADM_PASSWORD}
admin.age=${MAIN_ADM_AGE}

# Thymeleaf settings
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
